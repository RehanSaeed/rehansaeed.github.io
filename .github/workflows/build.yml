name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: read

jobs:
  build:
    name: Build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          lfs: true
      - name: "Setup Node"
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: "NPM Install"
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "NPM Build"
        run: npm run build
        env:
          TZ: UTC
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.GA4_MEASUREMENT_ID }}
      - name: "Type Check"
        run: npm run typecheck
      - name: "Cache Playwright Browsers"
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: "Install Playwright Browsers"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox
      - name: "Install Playwright Dependencies"
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox
      - name: "Playwright Test"
        run: npm test
        env:
          TZ: UTC
      - name: "Upload Playwright Report"
        uses: actions/upload-artifact@v7.0.0
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: "Setup Pages"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0
      - name: "Check Pages Cutover"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run pages:preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.GA4_MEASUREMENT_ID }}
      - name: "Upload Pages Artifact"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4.3.1
      - name: "Setup Node"
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: "Download exact Pages artifact"
        uses: actions/download-artifact@v8.0.1
        with:
          name: github-pages
          path: pages-artifact
      - name: "Extract verification marker"
        run: |
          mkdir -p dist
          tar -xf pages-artifact/artifact.tar -C dist ./deployment.json
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: "Verify Published Site"
        run: npm run pages:verify
      - name: "Send Outgoing Webmentions"
        id: webmentions
        continue-on-error: true
        run: npx --yes @remy/webmention@1.5.0 https://rehansaeed.com/rss.xml --limit 10 --send
      - name: "Report Webmention Failure"
        if: steps.webmentions.outcome == 'failure'
        run: echo "::warning::The website deployment passed verification, but outgoing webmentions failed. Retry the webmention command manually."
