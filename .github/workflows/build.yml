name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          lfs: true
      - name: "Setup Node"
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: "NPM Install"
        run: npm ci
      - name: "NPM Build"
        run: npm run build
        env:
          TZ: UTC
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Cache Playwright Browsers"
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: "Install Playwright Browsers"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox
      - name: "Install Playwright Dependencies"
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox
      - name: "Playwright Test"
        run: npm test
        env:
          TZ: UTC
      - name: "Upload Playwright Report"
        uses: actions/upload-artifact@v7.0.0
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: "Setup Pages"
        uses: actions/configure-pages@v6.0.0
      - name: "Upload Pages Artifact"
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: "Ping Sitemap to Google"
        run: curl http://www.google.com/ping?sitemap=https://rehansaeed.com/sitemap.xml
      - name: "Ping Sitemap to Bing"
        run: curl http://www.bing.com/ping?sitemap=https://rehansaeed.com/sitemap.xml
      - name: "Setup Node"
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
      - name: "Send Outgoing Webmentions"
        run: npx --yes @remy/webmention@1.5.0 https://rehansaeed.com/rss.xml --limit 10 --send
