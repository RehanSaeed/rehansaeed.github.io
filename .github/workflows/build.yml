name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
    - cron: "23 6 * * *"

permissions:
  contents: read
  issues: read
  pages: read

jobs:
  build:
    name: Generate
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'schedule' || github.event.schedule == '17 5 * * 1' || vars.GA4_PROPERTY_ID != '')
    runs-on: ubuntu-latest
    outputs:
      playwright-image: ${{ steps.playwright-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - name: "Check Git LFS Pointers"
        run: git lfs fsck --pointers
      - name: "Setup Node"
        id: node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: "Cache Public API Snapshots"
        uses: actions/cache@v6.1.0
        with:
          path: |
            .data/blog-comments.json
            .data/blog-portfolio.json
            .data/blog-nuget.json
            .data/blog-github-watchers.json
          key: blog-data-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'site.json', 'content.config.ts', 'modules/blog-content/**', 'shared/utils/**', 'content/portfolio/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            blog-data-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'site.json', 'content.config.ts', 'modules/blog-content/**', 'shared/utils/**', 'content/portfolio/**') }}-
      - name: "NPM Install"
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
      - name: "Resolve Playwright Image"
        id: playwright-image
        run: node -p "'image=mcr.microsoft.com/playwright:v' + require('playwright/package.json').version + '-noble'" >> "$GITHUB_OUTPUT"
      - name: "Cache Social Images"
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo/og-image
          key: og-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'nuxt.config.ts', 'server/plugins/og-title-lines.ts', 'server/utils/og-title-lines.ts', 'public/images/hero/**', 'public/images/author/**', 'node_modules/@fontsource/audiowide/files/**') }}-${{ github.sha }}
          restore-keys: |
            og-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'nuxt.config.ts', 'server/plugins/og-title-lines.ts', 'server/utils/og-title-lines.ts', 'public/images/hero/**', 'public/images/author/**', 'node_modules/@fontsource/audiowide/files/**') }}-
      - name: "Restore Previous Deployment Assets"
        uses: actions/cache/restore@v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo/skew-protection
          key: skew-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            skew-${{ runner.os }}-
      - name: "Cache Responsive Images"
        uses: actions/cache@v6.1.0
        with:
          path: .cache/nuxt-images
          key: ipx-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'nuxt.config.ts', 'modules/image-cache/**', 'modules/blog-content/paths.ts', 'public/**', 'content/**/*.png', 'content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.gif', 'content/**/*.svg', 'content/**/*.webp', 'content/**/*.avif') }}-${{ github.sha }}
          restore-keys: |
            ipx-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'nuxt.config.ts', 'modules/image-cache/**', 'modules/blog-content/paths.ts', 'public/**', 'content/**/*.png', 'content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.gif', 'content/**/*.svg', 'content/**/*.webp', 'content/**/*.avif') }}-
      - name: "Restore Article Traffic"
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .data/blog-traffic.json
          key: traffic-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            traffic-${{ runner.os }}-
      - name: "NPM Build"
        run: npm run build
        env:
          TZ: UTC
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          GA4_PROPERTY_ID: ${{ github.event_name != 'pull_request' && vars.GA4_PROPERTY_ID || '' }}
          GA4_START_DATE: ${{ github.event_name != 'pull_request' && vars.GA4_START_DATE || '' }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ github.event_name != 'pull_request' && secrets.GA4_SERVICE_ACCOUNT_JSON || '' }}
      - name: "Save Article Traffic"
        if: github.event_name != 'pull_request' && vars.GA4_PROPERTY_ID != ''
        uses: actions/cache/save@v6.1.0
        with:
          path: .data/blog-traffic.json
          key: traffic-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: "Package Browser Test Site"
        run: tar -cf playwright-site.tar dist .data/blog-image-metadata.json
      - name: "Upload Browser Test Site"
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-site
          path: playwright-site.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - name: "Save Deployment Assets"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo/skew-protection
          key: skew-${{ runner.os }}-${{ github.sha }}
      - name: "Setup Pages"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0
      - name: "Check Pages Cutover"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run pages:preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.GA4_MEASUREMENT_ID }}
      - name: "Upload Pages Artifact"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true

  quality:
    name: Quality
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'schedule' || github.event.schedule == '17 5 * * 1' || vars.GA4_PROPERTY_ID != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - name: "Verify Workflow Dependencies"
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
      - name: "Setup Node"
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: "Cache Public API Snapshots"
        uses: actions/cache@v6.1.0
        with:
          path: |
            .data/blog-comments.json
            .data/blog-portfolio.json
            .data/blog-nuget.json
            .data/blog-github-watchers.json
          key: blog-data-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'site.json', 'content.config.ts', 'modules/blog-content/**', 'shared/utils/**', 'content/portfolio/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            blog-data-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'site.json', 'content.config.ts', 'modules/blog-content/**', 'shared/utils/**', 'content/portfolio/**') }}-
      - name: "NPM Install"
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
      - name: "Test Lint Configuration"
        run: npm run test:lint
      - name: "Test Shared Utilities"
        run: npm run test:unit
      - name: "Type Check"
        run: npm run typecheck
      - name: "Lint"
        run: npm run lint

  test:
    name: Playwright (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    # Only Firefox needs a downloaded browser and additional Linux libraries.
    container:
      image: ${{ matrix.browser == 'firefox' && needs.build.outputs.playwright-image || '' }}
      options: --user 1001
      # The image has Git, but checkout also needs the runner's Git LFS binary.
      volumes:
        - /usr/bin/git-lfs:/usr/bin/git-lfs:ro
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - name: "Setup Node"
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: "Cache Public API Snapshots"
        uses: actions/cache@v6.1.0
        with:
          path: |
            .data/blog-comments.json
            .data/blog-portfolio.json
            .data/blog-nuget.json
            .data/blog-github-watchers.json
          key: blog-data-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'site.json', 'content.config.ts', 'modules/blog-content/**', 'shared/utils/**', 'content/portfolio/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            blog-data-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'site.json', 'content.config.ts', 'modules/blog-content/**', 'shared/utils/**', 'content/portfolio/**') }}-
      - name: "NPM Install"
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
      - name: "Download Browser Test Site"
        uses: actions/download-artifact@v8.0.2
        with:
          name: playwright-site
      - name: "Extract Browser Test Site"
        run: tar -xf playwright-site.tar
      - name: "Playwright Test"
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          TZ: UTC
      - name: "Upload Playwright Report"
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  checks:
    name: Build
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'schedule' || github.event.schedule == '17 5 * * 1' || vars.GA4_PROPERTY_ID != '')
    needs: [build, quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: "Require Generation, Quality and All Browsers"
        run: test "$BUILD_RESULT" = success && test "$QUALITY_RESULT" = success && test "$TEST_RESULT" = success
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, quality, test]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v7.0.1
      - name: "Setup Node"
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: "Download exact Pages artifact"
        uses: actions/download-artifact@v8.0.2
        with:
          name: github-pages
          path: pages-artifact
      - name: "Extract verification marker"
        run: |
          mkdir -p dist
          tar -xf pages-artifact/artifact.tar -C dist ./deployment.json
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: "Verify Published Site"
        run: npm run pages:verify
      - name: "Send Outgoing Webmentions"
        id: webmentions
        continue-on-error: true
        run: npx --yes @remy/webmention@1.5.0 https://rehansaeed.com/rss.xml --limit 10 --send
      - name: "Report Webmention Failure"
        if: steps.webmentions.outcome == 'failure'
        run: echo "::warning::The website deployment passed verification, but outgoing webmentions failed. Retry the webmention command manually."
