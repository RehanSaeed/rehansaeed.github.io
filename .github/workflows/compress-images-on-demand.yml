name: Compress Images On-Demand

on:
  workflow_dispatch:
  schedule:
    - cron: '00 23 * * 0'

jobs:
  build:
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          lfs: true
      - name: Compress Images
        id: calibre
        uses: calibreapp/image-actions@main
        with:
          compressOnly: true
          # Preserve the reviewed screenshots; palette compression alters window-edge alpha.
          ignorePaths: 'node_modules/**,public/images/hero/Microsoft-Copilot-Windows-3840x2160.png,public/images/hero/Microsoft-365-Companions-3072x1728.jpg,public/images/hero/Microsoft-Edge-Enterprise-1430x929.png,public/images/hero/Microsoft-Cortana-Windows-1560x880.jpg'
          jpegQuality: '90'
          jpegProgressive: false
          pngQuality: '90'
          webpQuality: '90'
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Create New Pull Request If Needed
        if: steps.calibre.outputs.markdown != ''
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          title: Compressed Images Nightly
          branch-suffix: timestamp
          commit-message: Compressed Images
          body: ${{ steps.calibre.outputs.markdown }}
