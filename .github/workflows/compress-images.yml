name: Compress Images

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Run Image Actions when JPG, JPEG, PNG or WebP files are added or changed.
    # See https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions#onpushpull_requestpaths for reference.
    paths:
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - "**.webp"

jobs:
  build:
    name: calibreapp/image-actions
    permissions:
      contents: write
      pull-requests: read
    # Skip forks, drafts and bot updates to avoid recursive recompression.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          lfs: true
          ref: ${{ github.head_ref }}
      - name: Compress Images
        uses: calibreapp/image-actions@main
        with:
          # Commit through Git below so optimized images retain LFS pointers.
          compressOnly: true
          # Preserve the reviewed screenshots; palette compression alters window-edge alpha.
          ignorePaths: 'node_modules/**,public/images/hero/Microsoft-Copilot-Windows-3840x2160.png,public/images/hero/Microsoft-365-Companions-3072x1728.jpg,public/images/hero/Microsoft-Edge-Enterprise-1430x929.png,public/images/hero/Microsoft-Cortana-Windows-1560x880.jpg'
          jpegQuality: "90"
          jpegProgressive: false
          pngQuality: "90"
          webpQuality: "90"
          # The `GITHUB_TOKEN` is automatically generated by GitHub and scoped only to the repository that is currently running the action. By default, the action can’t update Pull Requests initiated from forked repositories.
          # See https://docs.github.com/en/actions/reference/authentication-in-a-workflow and https://help.github.com/en/articles/virtual-environments-for-github-actions#token-permissions
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit optimized images with LFS
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git add --renormalize -- .
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimize images with Git LFS" -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git lfs fsck --pointers
          git push origin "HEAD:$PR_BRANCH"
